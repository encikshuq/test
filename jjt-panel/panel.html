<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>JJT Admin — Jalan Jalan Travel</title>
<link rel="icon" href="__BASE__favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="__BASE__images/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2E6B;--blue:#1B4B9B;--green:#1D9A55;--orange:#F28C28;--bg:#EEF2FA;--line:#DCE3F0;--ink:#1F2A44;--mut:#6B7895;--soft:#F6F8FC}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue)}
img{display:block}
.hide{display:none!important}
/* ---------- login ---------- */
#login{min-height:100vh;display:flex}
#login .pic{flex:1.2;background:var(--navy);position:relative;overflow:hidden}
#login .pic img{width:100%;height:100%;object-fit:cover}
#login .pic .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 56px;background:var(--navy);color:#fff}
#login .pic h2{font-size:28px;line-height:1.25}
#login .form{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;padding:32px 20px}
#login .box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.err{color:#B03A2E;font-size:13px;min-height:20px}
@media(max-width:860px){#login .pic{display:none}}
/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:236px;background:var(--navy);color:#C9D6EE;padding:18px 14px;display:flex;flex-direction:column;gap:2px;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform .2s}
.logo{padding:6px 4px 10px;display:flex;justify-content:center}
.logo img{width:100%;max-width:200px;height:auto}
.side .lbl{font-size:11px;letter-spacing:.12em;color:#7F95C0;padding:12px 12px 10px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#C9D6EE;text-decoration:none;font-size:14px}
.nav:hover{background:#ffffff14}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:var(--blue);color:#fff;font-weight:600}
.nav .n{margin-left:auto;background:var(--green);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px;font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:#7F95C0;padding:0 12px;display:flex;flex-direction:column;gap:8px}
.side .foot button{color:#C9D6EE;text-align:left;padding:0}
.main{flex:1;margin-left:236px;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;display:flex;align-items:center;padding:0 28px;gap:14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:19px;color:var(--navy);line-height:1.2}
.crumb{color:var(--mut);font-size:12px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.burger{display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);align-items:center;justify-content:center}
.content{padding:22px 28px 40px;display:flex;flex-direction:column;gap:16px}
.scrim{display:none}
@media(max-width:900px){
 .side{transform:translateX(-100%)}.side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:#0B2E6B66;z-index:25}
 .main{margin-left:0}.burger{display:flex}
 .top{padding:0 16px}.content{padding:16px}
 .top .r .who{display:none}
}
/* ---------- parts ---------- */
.card{background:#fff;border-radius:12px;border:1px solid var(--line);padding:18px}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:15px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:1/-1}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--blue);color:#fff;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--green)}.btn.o{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.s{height:30px;padding:0 10px;font-size:12px}.btn.red{background:#fff;color:#B03A2E;border:1.5px solid #E5B4AE}
.btn.ghost{background:none;color:var(--mut);height:30px;padding:0 8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;padding:10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bg);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#F7F9FD}tr.sel td{background:#EEF3FC}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-g{background:#E3F4EA;color:#167A43}.c-y{background:#FFF3D6;color:#9A6B00}.c-r{background:#FBE4E1;color:#B03A2E}.c-b{background:#E3EBFA;color:var(--blue)}.c-x{background:#EEF0F4;color:#5D6780}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.lb{font-size:12.5px;color:#46536D;font-weight:600}
.in{height:40px;border:1px solid #CBD5E7;border-radius:8px;padding:0 12px;background:#fff;width:100%;outline:none}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1B4B9B22}
textarea.in{height:auto;min-height:84px;padding:9px 12px;resize:vertical}
.hint{font-size:12px;color:var(--mut)}
.thumb{width:56px;height:38px;border-radius:6px;object-fit:cover;background:var(--line)}
.tog{width:38px;height:22px;border-radius:11px;background:#C5CDDC;position:relative;flex:none;transition:.15s}
.tog:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--green)}.tog.on:after{left:19px}
.tgl{display:flex;align-items:center;gap:10px;cursor:pointer}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 16px;font-weight:600;color:var(--mut);border-bottom:2.5px solid transparent;white-space:nowrap;text-decoration:none}
.tab.on{color:var(--blue);border-color:var(--blue)}
.kpi{border-top:4px solid var(--blue)}
.kpi .v{font-size:32px;font-weight:700;color:var(--navy);line-height:1.2;margin:4px 0}
.bar{height:8px;border-radius:4px;background:#E3EBFA;overflow:hidden;width:120px}.bar i{display:block;height:100%}
.mut{color:var(--mut)}.sm{font-size:12px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.drop{border:2px dashed #9DB2DA;border-radius:10px;padding:26px;text-align:center;background:var(--soft);cursor:pointer}
.drop:hover{background:#EEF3FC}
.bnr{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1920/600;background:var(--line)}
.bnr img{width:100%;height:100%;object-fit:cover}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.dcard{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;text-align:left}
.dcard.on{outline:2.5px solid var(--blue)}
.dcard .ph{height:96px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.dcard .ph img{width:100%;height:100%;object-fit:cover}
.dcard .t{padding:8px 10px}
.day{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.day .hd{display:flex;align-items:center;gap:10px}
.dn{background:var(--navy);color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:3px 8px;flex:none}
.editor{border:1px solid #CBD5E7;border-radius:8px;min-height:280px;padding:16px;line-height:1.7;outline:none;background:#fff}
.editor:focus{border-color:var(--blue)}
.edbar{display:flex;gap:4px;flex-wrap:wrap}
.edbar button{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-weight:600;font-size:12.5px;background:#fff}
.plist button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px}
.plist button.on{background:var(--blue);color:#fff;font-weight:600}
.plist button:not(.on):hover{background:var(--soft)}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.split>*{min-width:0}
.editor h2{font-size:19px;color:var(--navy);margin:18px 0 6px}.editor h2:first-child{margin-top:0}
.editor ul{padding-left:22px}.editor .tip{background:#FFF4EC;border-radius:8px;padding:10px 12px;color:#6B3410;margin:10px 0}
.editor .tip svg,.editor .ci svg,.editor h2 .n{display:none}
.editor .chk{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editor .chk>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.editor .chk h3{font-size:14px;margin:0}
.editor table{border-collapse:collapse;width:100%}.editor td,.editor th{border:1px solid var(--line);padding:6px 8px;text-transform:none;letter-spacing:0;font-size:13px}
.pvw{display:flex;flex-direction:column;gap:8px;min-width:0}
.pvbar{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:4px}
.pvbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 6px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--mut);white-space:nowrap}
.pvbar button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pvbar button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(11,46,107,.12)}
.pvbar button[data-big]{flex:0 0 40px}
.pvbox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#E9EDF5}
.pvbox iframe{position:absolute;left:50%;top:0;border:0;background:#fff;transform-origin:50% 0;box-shadow:0 0 0 1px var(--line)}
.pvsz{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.pvw.big{position:fixed;inset:14px;z-index:1001;background:#fff;padding:12px;border-radius:14px;box-shadow:0 24px 70px rgba(6,24,58,.45)}
.pvw.big .pvbox{flex:1;height:auto!important}
.pvdim{position:fixed;inset:0;background:rgba(6,24,58,.55);z-index:1000}
.dirty{margin-left:auto;font-weight:600}
.etabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;align-self:flex-start}
.etabs button{padding:8px 16px;border-radius:8px;font-weight:600;color:var(--mut)}
.etabs button.on{background:var(--navy);color:#fff}
.aibox{border:1px dashed #B9A8F0;background:linear-gradient(135deg,#F7F4FF,#F2F7FF);position:relative}
.aibox .soon{background:#6B4FD8;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.03em}
.aisteps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.aisteps div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#46536D;line-height:1.45}
.aisteps b{display:block;color:var(--navy);font-size:13px;margin-bottom:2px}
.aisteps i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#6B4FD8;color:#fff;font-size:11px;font-weight:700;margin-bottom:6px}
.aioff{opacity:.55;pointer-events:none;user-select:none}
@media(max-width:900px){.aisteps{grid-template-columns:1fr 1fr}}
.saving{position:fixed;right:16px;bottom:16px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;z-index:2000}.saving.show{opacity:.9}
.cnt{font-size:11.5px;color:var(--mut);text-align:right}.cnt.bad{color:#B03A2E}
.gpv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:arial,sans-serif;background:#fff}
.gpv .u{font-size:12px;color:#202124}.gpv .t{font-size:17px;color:#1a0dab;margin:2px 0;line-height:1.3}.gpv .d{font-size:13px;color:#4d5156;line-height:1.45}
.pgrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bg)}.pgrow:last-child{border-bottom:0}
.pgrow b{font-size:14px}.pgrow .sm{margin-top:1px}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:7px 14px;font-weight:600;font-size:13px;color:var(--mut)}.seg button.on{background:var(--blue);color:#fff}
.dlt{font-size:12px;font-weight:600}.dlt.up{color:#167A43}.dlt.dn{color:#B03A2E}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hb .tr{height:10px;background:var(--bg);border-radius:4px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.chartbox{position:relative}.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px #0B2E6B1f;white-space:nowrap;display:none}
.fun{display:flex;flex-direction:column;gap:8px}.fun .st{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.fun .st .tr{height:26px;background:var(--bg);border-radius:4px}.fun .st .tr i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.drop2{font-size:11.5px;color:var(--mut);padding-left:160px}
@media(max-width:700px){.fun .st{grid-template-columns:100px 1fr 56px}.drop2{padding-left:110px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-weight:500;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo{background:#FFF3D6;color:#7A5500;font-size:12.5px;padding:8px 28px;border-bottom:1px solid #F1DFAF}
.ord{display:flex;flex-direction:column}
.ord button{line-height:1;padding:2px 6px;color:var(--mut)}
.ord button:hover{color:var(--blue)}
.dl td{padding:6px 0;border:0}.dl td:first-child{color:var(--mut);width:90px}
.pw{position:relative;display:block}
.pw > input{padding-right:44px!important;width:100%}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:#7A869E;display:grid;place-items:center;cursor:pointer;border-radius:8px}
.pw-eye:hover{color:var(--navy);background:#F1F4FA}
.pw-eye:focus-visible{outline:2px solid var(--orange)}
.pw-eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<!-- ============ LOG MASUK ============ -->
<div id="login" class="hide">
  <div class="pic"><img src="__BASE__images/hero.jpg" alt=""><div class="cap"><h2>Panel Admin<br>Jalan Jalan Travel</h2><p style="opacity:.85;margin-top:8px">Urus pakej, promo dan inquiry pelanggan di satu tempat.</p></div></div>
  <div class="form"><form class="box" id="loginForm" autocomplete="on">
    <img src="__BASE__images/logo.png" alt="Jalan Jalan Travel" style="height:56px;width:auto;align-self:flex-start">
    <div><h1 style="font-size:24px;color:var(--navy)">Log masuk</h1><p class="mut">Untuk staf JJT sahaja</p></div>
    <div class="f"><label for="le">E-mel</label><input class="in" id="le" type="email" required autocomplete="username"></div>
    <div class="f"><label for="lp">Kata laluan</label><input class="in" id="lp" type="password" required placeholder="Kata laluan" autocomplete="current-password"></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><span></span><a href="#" id="forgot" class="sm" style="font-weight:600">Lupa kata laluan?</a></div>
    <div class="err" id="lerr"></div>
    <button class="btn" id="lgo" type="submit" style="height:46px;font-size:15px">Log Masuk</button>
    <p class="hint" style="text-align:center">Akaun dikunci 15 minit selepas 5 cubaan salah.</p>
  </form></div>
</div>

<!-- ============ APLIKASI ============ -->
<div id="app" class="app hide">
  <aside class="side" id="side">
    <div class="logo"><img src="__BASE__images/logo-panel.png?v=2" alt="Jalan Jalan Travel"></div>
    <div class="lbl">PANEL ADMIN</div>
    <nav id="nav"></nav>
    <div class="foot"><a class="nav" href="__BASE__" target="_blank" style="padding:8px 0">Lihat website ↗</a><button id="gantiPass">🔑 Tukar kata laluan</button><button id="logout">Log keluar</button><span>JJT Panel · v1.0</span></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top"><button class="burger" id="burger" aria-label="Menu">☰</button><div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="r"><span id="topAct"></span><span class="who sm mut" id="who"></span><div class="av" id="av">AJ</div></div></header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="saving" id="saving">Menyimpan…</div>

<script>window.PANEL = __PANEL__;</script>
<script>
(function(){
'use strict';
const SITE = PANEL.base;
const CSRF = PANEL.csrf;
const KEY = 'jjt-admin-v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);
const iso = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
const today = () => iso(new Date());
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return iso(x); };
const tBM = iso => iso ? new Date(iso + (iso.length === 10 ? 'T00:00:00' : '')).toLocaleDateString('ms-MY', {day:'numeric', month:'short', year:'numeric'}) : '—';
const rm = n => 'RM' + Number(n || 0).toLocaleString('en-MY');
// gambar: cuba laluan relatif dulu (bila dipasang dalam repo), jika gagal guna website demo
const img = (p, cls = '', alt = '') => {
  if (!p) return '';
  const src = /^(data:|https?:|\/)/.test(p) ? p : SITE + p.replace(/^\.?\//, '');
  return `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}">`;
};

/* ============ DATA ============ */
const BLOG_ISI = {"makanan-halal-jepun": "<p class=\"lede\">Jepun kini antara destinasi paling mesra Muslim di Asia Timur. Restoran halal makin banyak di Tokyo, Osaka dan Kyoto — tapi di luar bandar besar, anda masih perlu sedikit persediaan. Ini 7 tips yang kami amalkan dalam setiap trip JJT.</p>\n\n<h2><span class=\"n\">1</span>Muat turun app pencari restoran halal</h2>\n<p>Sebelum berlepas, pasang app seperti <b>Halal Navi</b> atau <b>Halal Gourmet Japan</b>. Kedua-duanya menunjukkan restoran berdekatan dengan status halal, Muslim-friendly atau tanpa babi, berserta ruang solat berhampiran.</p>\n\n<h2><span class=\"n\">2</span>Faham beza \"halal\", \"Muslim-friendly\" dan \"pork-free\"</h2>\n<ul>\n<li><b>Halal</b> — disahkan oleh badan pensijilan; daging disembelih dan tiada alkohol.</li>\n<li><b>Muslim-friendly</b> — tiada babi, tetapi mungkin guna daging tidak disembelih atau sos beralkohol.</li>\n<li><b>Pork-free</b> — hanya tiada babi. Bahan lain perlu disemak sendiri.</li>\n</ul>\n\n<h2><span class=\"n\">3</span>Kenali perkataan Jepun pada label</h2>\n<p>Bawa tangkap layar senarai ini. Jika nampak perkataan berikut pada bungkusan, elakkan:</p>\n<ul>\n<li><b>豚 (buta)</b> / <b>ポーク</b> — babi</li>\n<li><b>ラード (rādo)</b> — lemak babi</li>\n<li><b>ゼラチン (zerachin)</b> — gelatin, selalunya daripada haiwan</li>\n<li><b>みりん (mirin)</b> dan <b>酒 (sake)</b> — mengandungi alkohol, biasa dalam sos teriyaki</li>\n</ul>\n\n<h2><span class=\"n\">4</span>Pilih menu laut dan sayur di kedai serbaneka</h2>\n<p>7-Eleven, Lawson dan FamilyMart memudahkan sarapan pagi. Onigiri isi <b>salmon (鮭)</b>, <b>tuna mayo (ツナマヨ)</b> atau <b>umeboshi (梅)</b> biasanya pilihan selamat — tetapi tetap baca label kerana sesetengah perisa guna sos beralkohol.</p>\n<div class=\"tip\"><svg class=\"ic \"><use href=\"#info\"/></svg><div><b>Tip JJT:</b> Gunakan kamera Google Translate pada label bahan. Ia membaca tulisan Jepun dengan cepat dan cukup tepat untuk semakan asas.</div></div>\n\n<h2><span class=\"n\">5</span>Rancang makan berhampiran masjid</h2>\n<p>Kawasan sekitar masjid seperti <b>Tokyo Camii</b> di Shibuya dan <b>Masjid Kobe</b> biasanya ada kedai makanan halal dan runcit Muslim. Satu perjalanan, dua keperluan: solat dan makan.</p>\n\n<h2><span class=\"n\">6</span>Bawa bekalan ringan dari Malaysia</h2>\n<p>Mi segera halal, serunding atau sambal botol memudahkan malam yang penat atau hari di kawasan luar bandar. Pastikan ia dibungkus kedap dan diisytiharkan jika diminta di kastam.</p>\n\n<h2><span class=\"n\">7</span>Pilih pakej yang sudah menyusun makan halal</h2>\n<p>Cara paling tenang ialah pakej yang sudah termasuk makan di restoran halal dan Muslim-friendly. Dalam pakej Jepun JJT, setiap hidangan yang termasuk telah disemak, dan tour leader Muslim membantu untuk makan di luar jadual.</p>", "musim-terbaik-new-zealand": "<p class=\"lede\">New Zealand terletak di hemisfera selatan, jadi musimnya terbalik berbanding Jepun, Korea atau Eropah. Disember ialah musim panas, Julai pula musim sejuk. Jadi \"bila masa terbaik\" bergantung kepada apa yang anda mahu lihat dan buat.</p>\n\n<h2><span class=\"n\">1</span>Ringkasan musim</h2>\n<div class=\"tbl\"><table>\n<thead><tr><th>Musim</th><th>Bulan</th><th>Sesuai untuk</th></tr></thead>\n<tbody>\n<tr><td><b>Panas</b></td><td>Dis – Feb</td><td>Cuaca cerah, hari panjang, aktiviti luar dan pantai</td></tr>\n<tr><td><b>Luruh</b></td><td>Mac – Mei</td><td>Daun kuning dan merah, cuaca selesa, kurang sesak</td></tr>\n<tr><td><b>Sejuk</b></td><td>Jun – Ogo</td><td>Salji dan ski di Queenstown, pemandangan gunung</td></tr>\n<tr><td><b>Bunga</b></td><td>Sep – Nov</td><td>Bunga lupin, anak biri-biri, harga lebih berpatutan</td></tr>\n</tbody></table></div>\n\n<h2><span class=\"n\">2</span>Untuk pemandangan terbaik: Mac – Mei</h2>\n<p>Musim luruh ialah pilihan ramai pelanggan JJT. Cuaca sejuk-sejuk nyaman, warna daun di Arrowtown dan Wanaka sangat cantik, dan tarikan utama tidak sesesak musim panas.</p>\n\n<h2><span class=\"n\">3</span>Untuk pengalaman salji: Jun – Ogos</h2>\n<p>Jika anak-anak teringin bermain salji, musim sejuk sesuai — dan ia bertembung dengan cuti sekolah pertengahan tahun di Malaysia. Bawa jaket tebal, sarung tangan dan kasut kalis air.</p>\n\n<h2><span class=\"n\">4</span>Untuk bajet: Sep – Nov</h2>\n<p>Musim bunga biasanya menawarkan harga tiket dan hotel yang lebih rendah berbanding musim puncak Disember. Ladang bunga lupin di Tekapo mula berkembang sekitar November.</p>\n<div class=\"tip\"><svg class=\"ic \"><use href=\"#info\"/></svg><div><b>Tip JJT:</b> Waktu siang sangat panjang pada musim panas — Maghrib boleh lewat hingga jam 9 malam. Semak waktu solat harian dengan app dan rancang makan malam lebih awal.</div></div>\n\n<h2><span class=\"n\">5</span>Perkara lain untuk dirancang</h2>\n<ul>\n<li><b>NZeTA</b> — pelancong Malaysia perlu memohon NZeTA sebelum berlepas. Semak syarat terkini di laman rasmi Imigresen New Zealand.</li>\n<li><b>Pandu kiri</b> — sama seperti Malaysia, jadi sesuai untuk trip pandu sendiri.</li>\n<li><b>Makanan halal</b> — mudah di Auckland dan Christchurch; di bandar kecil, rancang lebih awal.</li>\n</ul>", "senarai-semak-barang-travel": "<p class=\"lede\">Beg yang tersusun bermakna percutian yang lebih tenang. Ini senarai semak yang pasukan JJT kongsikan dengan setiap pelanggan sebelum berlepas. Tangkap layar atau cetak, dan tandakan satu per satu.</p>\n\n<div class=\"chk\">\n <div><h3><span class=\"ci\"><svg class=\"ic \"><use href=\"#passport\"/></svg></span>Dokumen</h3><ul>\n  <li>Pasport sah sekurang-kurangnya 6 bulan</li><li>Visa / kebenaran masuk (jika perlu)</li><li>Salinan pasport — cetak &amp; dalam telefon</li><li>Insurans perjalanan</li><li>Tiket &amp; tempahan hotel</li></ul></div>\n <div><h3><span class=\"ci\"><svg class=\"ic \"><use href=\"#f-mosque\"/></svg></span>Solat &amp; Ibadah</h3><ul>\n  <li>Sejadah travel yang ringan</li><li>Telekung nipis / kain pelikat</li><li>App waktu solat &amp; arah kiblat</li><li>Botol kecil untuk istinjak</li></ul></div>\n <div><h3><span class=\"ci\"><svg class=\"ic \"><use href=\"#shield\"/></svg></span>Kesihatan</h3><ul>\n  <li>Ubat peribadi + preskripsi doktor</li><li>Ubat demam, selsema &amp; perut</li><li>Pelembap &amp; pelindung matahari</li><li>Pembersih tangan</li></ul></div>\n <div><h3><span class=\"ci\"><svg class=\"ic \"><use href=\"#phone2\"/></svg></span>Gajet</h3><ul>\n  <li>Adapter universal</li><li>Power bank (dalam beg tangan, bukan bagasi)</li><li>Kad SIM / eSIM data</li><li>Kabel pengecas cadangan</li></ul></div>\n <div><h3><span class=\"ci\"><svg class=\"ic \"><use href=\"#sun\"/></svg></span>Pakaian</h3><ul>\n  <li>Ikut musim destinasi</li><li>Kasut berjalan yang selesa</li><li>Pakaian berlapis untuk cuaca sejuk</li><li>Tudung / topi lebih</li></ul></div>\n <div><h3><span class=\"ci\"><svg class=\"ic \"><use href=\"#coin\"/></svg></span>Kewangan</h3><ul>\n  <li>Kad debit pelbagai mata wang</li><li>Sedikit tunai mata wang tempatan</li><li>Maklumkan bank tentang perjalanan</li><li>Simpan nombor kecemasan bank</li></ul></div>\n</div>\n\n<h2><span class=\"n\">1</span>Asingkan dokumen penting</h2>\n<p>Simpan pasport, tiket dan dompet dalam satu beg kecil yang sentiasa dibawa. Jangan letak dokumen penting dalam bagasi yang didaftar masuk.</p>\n\n<h2><span class=\"n\">2</span>Semak had bagasi syarikat penerbangan</h2>\n<p>Setiap syarikat penerbangan berbeza. Timbang beg di rumah dan tinggalkan ruang kira-kira 3 hingga 5 kg untuk ole-ole.</p>\n<div class=\"tip\"><svg class=\"ic \"><use href=\"#info\"/></svg><div><b>Tip JJT:</b> Pelanggan pakej JJT akan menerima senarai semak khusus mengikut destinasi dan musim, termasuk taklimat sebelum berlepas bersama tour leader.</div></div>"};

   ${field('Tajuk (untuk carian Google & pembaca skrin)', `<input class="in" id="bT" value="${esc(e.tajuk)}" placeholder="Cth: Promo Jepun dari RM7,290">`)}
   ${field('Pautan butang', `<select class="in" id="bL">${opt('', 'Tiada pautan', e.pautan)}${S.pakej.map(p => opt(p.id, 'Pakej: ' + p.nama, e.pautan)).join('')}</select>`)}
   <div class="row">${field('Tarikh mula', `<input class="in" type="date" id="bM" value="${esc(e.mula)}">`)}${field('Tarikh tamat', `<input class="in" type="date" id="bE" value="${esc(e.tamat)}">`)}</div>

  const dz = $('#bPick'); dz.ondragover = ev => ev.preventDefault(); dz.ondrop = ev => { ev.preventDefault(); sync(); readFile(ev.dataTransfer.files[0], 2097152, d => { e.img = d; vBanner(); }); };

/* PDF: buka paparan cetak bergaya JJT, pengguna pilih "Simpan sebagai PDF" (tiada perisian tambahan di server) */
function cetakPDF(tajuk, sub, isi, landskap, nama){
  const w = window.open('', '_blank'); if (!w) return toast('Pop-up disekat. Benarkan pop-up untuk dashboard ini.');
  const fail = (nama || tajuk).replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '-' + today();
  w.document.write(`<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><title>${esc(fail)}</title><style>
    @page{size:A4 ${landskap ? 'landscape' : 'portrait'};margin:14mm 12mm}
    *{box-sizing:border-box}body{font-family:Poppins,system-ui,Segoe UI,Roboto,sans-serif;color:#13254A;margin:0;font-size:${landskap ? '10px' : '12.5px'}}
    .bar{background:#0B2E6B;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:13px}.bar button{background:#F26A1F;color:#fff;border:0;border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer}
    .pg{padding:18px}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #F26A1F;padding-bottom:10px;margin-bottom:14px}
    header img{height:38px}h1{margin:0;font-size:18px;color:#0B2E6B}.s{color:#5B6B88;font-size:11px;margin-top:2px;text-align:right}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:6px 7px;border-bottom:1px solid #DCE3EF}
    thead th{background:#EEF2F9;color:#0B2E6B;font-size:.95em}tbody tr{page-break-inside:avoid}.m{color:#5B6B88}
    table.dl th{width:32%;background:#F5F7FB;color:#0B2E6B;font-weight:600}
    footer{margin-top:14px;font-size:10px;color:#7A869E;border-top:1px solid #DCE3EF;padding-top:6px}
    @media print{.bar{display:none}.pg{padding:0}}</style></head><body>
    <div class="bar"><span>Pada tetingkap cetak, pilih <b>Simpan sebagai PDF</b> (Save as PDF) di bahagian <b>Destinasi</b>.</span><button onclick="print()">Cetak / Simpan PDF</button></div>
    <div class="pg"><header><img src="${esc(SITE)}images/logo.png" alt="Jalan Jalan Travel"><div><h1>${esc(tajuk)}</h1><div class="s">${esc(sub)}</div><div class="s">Dijana: ${new Date().toLocaleString('ms-MY')} · oleh ${esc(session.nama)}</div></div></header>
    ${isi}<footer>SULIT: Mengandungi data peribadi pelanggan. Untuk kegunaan dalaman Jalan Jalan Travel sahaja. Jangan kongsi tanpa kebenaran.</footer></div>
    <script>window.onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close();
}

/* ============ SKRIN: STATISTIK ============ */
let stDays = 30;
function statData(){
  // data contoh tetap (sama setiap kali dibuka) untuk 180 hari lepas
  let seedN = 7; const rnd = () => (seedN = (seedN * 16807) % 2147483647) / 2147483647;
  const t = today(), out = [];
  for (let i = 179; i >= 0; i--) { const d = addDays(t, -i), dow = new Date(d + 'T00:00:00').getDay();
    const base = 140 + (179 - i) * 0.45 + (dow === 0 || dow === 6 ? 45 : 0) + (i % 30 < 3 ? 60 : 0);
    const v = Math.round(base * (0.8 + rnd() * 0.4)); out.push({d, v, pv: Math.round(v * (2.6 + rnd() * 0.6)), wa: Math.round(v * (0.035 + rnd() * 0.02)), inq: Math.round(v * (0.012 + rnd() * 0.01))}); }
  return out;
}
function vStat(){
  head('Statistik', 'Statistik');
  const all = statData(), cur = all.slice(-stDays), prev = all.slice(-stDays * 2, -stDays);
  const sum = (a, k) => a.reduce((x, r) => x + r[k], 0);
  const n = x => x.toLocaleString('en-MY');
  const dl = (a, b) => { if (!b) return ''; const c = Math.round((a - b) / b * 100); return `<span class="dlt ${c >= 0 ? 'up' : 'dn'}">${c >= 0 ? '▲' : '▼'} ${Math.abs(c)}%</span> <span class="sm mut">vs ${stDays} hari sebelum</span>`; };
  const V = sum(cur, 'v'), PV = sum(cur, 'pv'), WA = sum(cur, 'wa'), IQ = sum(cur, 'inq');
  // pakej paling dilihat: diagih dari paparan halaman, diberi berat tetap ikut pakej
  let sn = 3; const r2 = () => (sn = (sn * 48271) % 2147483647) / 2147483647;
  const pk = S.pakej.filter(p => p.aktif).map(p => ({p, w: (p.badge === 'Popular' ? 3 : 1) * (0.5 + r2())}));
  const tw = pk.reduce((x, y) => x + y.w, 0), pkTot = Math.round(PV * 0.42);
  pk.forEach(x => { x.views = Math.round(pkTot * x.w / tw); x.wa = Math.round(x.views * (0.02 + r2() * 0.05)); });
  pk.sort((a, b) => b.views - a.views); const top = pk.slice(0, 8), maxV = top[0] ? top[0].views : 1;

function lineChart(box, rows){
  const W = Math.max(320, box.clientWidth), H = 240, L = 44, R = 12, T = 12, B = 28;
  const max = Math.max(...rows.map(r => r.v)), step = max > 400 ? 100 : 50, top = Math.ceil(max / step) * step;
  const X = i => L + (rows.length === 1 ? 0 : i / (rows.length - 1) * (W - L - R)), Y = v => T + (1 - v / top) * (H - T - B);
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  const nx = Math.min(6, rows.length), xi = Array.from({length: nx}, (_, k) => Math.round(k * (rows.length - 1) / (nx - 1)));
  const path = rows.map((r, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(r.v).toFixed(1)).join('');
  const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('ms-MY', {day:'numeric', month:'short'});
  box.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Pelawat harian" style="display:block">
   ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6EBF4"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#6B7895">${v}</text>`).join('')}
   ${xi.map(i => `<text x="${X(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === rows.length - 1 ? 'end' : 'middle'}" font-size="11" fill="#6B7895">${fmt(rows[i].d)}</text>`).join('')}
   <path d="${path} L${X(rows.length - 1)} ${Y(0)} L${X(0)} ${Y(0)}Z" fill="#1B4B9B" fill-opacity=".08"/>
   <path d="${path}" fill="none" stroke="#1B4B9B" stroke-width="2" stroke-linejoin="round"/>
   <line id="cx" y1="${T}" y2="${H - B}" stroke="#9DB2DA" stroke-dasharray="3 3" visibility="hidden"/><circle id="cd" r="5" fill="#1B4B9B" stroke="#fff" stroke-width="2" visibility="hidden"/>
   <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tp"></div>`;
  const svg = box.querySelector('svg'), cx = box.querySelector('#cx'), cd = box.querySelector('#cd'), tp = box.querySelector('#tp');
  const show = ev => { const r = svg.getBoundingClientRect(), x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((x - L) / (W - L - R) * (rows.length - 1)))), d = rows[i];
    cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cx.setAttribute('visibility', 'visible');
    cd.setAttribute('cx', X(i)); cd.setAttribute('cy', Y(d.v)); cd.setAttribute('visibility', 'visible');
    tp.innerHTML = `<b>${tBM(d.d)}</b><br>${d.v.toLocaleString('en-MY')} pelawat · ${d.pv.toLocaleString('en-MY')} paparan<br>${d.wa} klik WhatsApp`;
    tp.style.display = 'block'; tp.style.left = Math.min(W - tp.offsetWidth - 4, Math.max(0, X(i) + 12)) + 'px'; tp.style.top = Math.max(0, Y(d.v) - 60) + 'px'; };
  const hide = () => { cx.setAttribute('visibility', 'hidden'); cd.setAttribute('visibility', 'hidden'); tp.style.display = 'none'; };
  const hit = box.querySelector('#hit'); hit.onmousemove = show; hit.ontouchstart = hit.ontouchmove = show; hit.onmouseleave = hide; hit.ontouchend = () => setTimeout(hide, 1500);
}

function pvBind(id, apply){

function pvTT(el, text){ if (!el) return; const em = el.querySelector('em');

  const before = (el.textContent.slice(0, el.textContent.indexOf(em.textContent)).trim().split(/\s+/).filter(Boolean)).length, w = text.trim().split(/\s+/);
  const n = Math.min(before, Math.max(0, w.length - 1));

/* ============ ROUTER & SESI ============ */
function route(){
  if (!session) { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); return; }
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#side').classList.remove('open'); $('#scrim').classList.remove('open');
  $('#who').textContent = session.nama + ' · ' + session.peranan;
  $('#av').textContent = session.nama.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const [, k = 'utama', a, b] = location.hash.split('/');
  if (!allowed(k)) { toast('Skrin ini untuk Pentadbir sahaja'); location.hash = '#/utama'; return; }
  if (!(k === 'pakej' && a)) draftOf = null;
  if ((k === 'inquiry' || k === 'utama') && !route._inq) { route._inq = true; api('inquiry').then(j => { route._inq = false; if (!j.ok) return; const now = JSON.stringify(j.v);
    if (now !== SNAP.inquiry && JSON.stringify(S.inquiry) === SNAP.inquiry) { S.inquiry = j.v; SNAP.inquiry = now; const [, k2 = 'utama', a2] = location.hash.split('/'); drawNav(k2); if (k2 === 'inquiry') vInquiry(a2); else if (k2 === 'utama') vUtama(); } }); }
  if (!(k === 'blog' && a)) bDraftOf = null;
  if (k !== 'laman') uDraft = null;
  $('#view').oninput = null; document.querySelectorAll('body > .pvw, .pvdim').forEach(x => x.remove());
  drawNav(k === 'kategori' ? 'pakej' : k);
  ({utama: vUtama, statistik: vStatistik, laman: vLaman, kategori: () => vKategori(a), banner: () => vAkan('Banner Promo', 'Banner promo berjadual (gambar promosi yang menggantikan hero di halaman Utama mengikut tarikh) akan diaktifkan dalam fasa seterusnya. Buat masa ini, tukar gambar hero di menu <a href="#/laman">Halaman Utama</a>.'), destinasi: vDest, testimoni: vTesti, blog: () => a ? vBlogEdit(a) : vBlog(), kandungan: vKandungan, tetapan: vTetapan,
    pakej: () => a ? vPakejEdit(a, b) : vPakej(), inquiry: () => vInquiry(a)}[k] || vUtama)();
  window.scrollTo(0, 0);
}
document.addEventListener('click', ev => { const r = ev.target.closest('tr[data-go]'); if (r && !ev.target.closest('a,button,input,select')) location.hash = r.dataset.go; });
window.addEventListener('hashchange', route);
$('#burger').onclick = () => { $('#side').classList.add('open'); $('#scrim').classList.add('open'); };
$('#scrim').onclick = () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); };
/* Tukar kata laluan sendiri: dibuka oleh semua pengguna (Pentadbir & Staf) */
function tukarPass(paksa){
  paksa = paksa === true;
  if ($('#pwM')) return;
  const d = document.createElement('div'); d.id = 'pwM';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(11,46,107,.45);z-index:9999;display:grid;place-items:center;padding:16px';
  const f = (id, l) => `<label style="display:block;font-weight:600;font-size:13px;margin:12px 0 5px">${l}</label><input class="in" type="password" id="${id}" style="width:100%">`;
  d.innerHTML = `<div style="background:#fff;border-radius:14px;padding:22px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.25)">
    <b style="font-size:17px;color:var(--navy)">${paksa ? 'Tetapkan kata laluan baharu' : 'Tukar kata laluan'}</b><div class="sm mut">${esc(session.nama)} · ${esc(session.emel || '')}</div>
    ${paksa ? '<p class="sm" style="background:#FFF4E5;color:#7A3E00;border-radius:8px;padding:9px 11px;margin:12px 0 0;line-height:1.5">Anda log masuk dengan <b>kata laluan sementara</b>. Sila tetapkan kata laluan baharu sendiri sebelum menggunakan dashboard.</p>' : ''}
    ${f('pwL', paksa ? 'Kata laluan sementara' : 'Kata laluan semasa')}${f('pwB', 'Kata laluan baharu (min. 8 aksara)')}${f('pwU', 'Taip semula kata laluan baharu')}
    <div id="pwE" class="sm" style="color:#B42318;min-height:18px;margin-top:10px"></div>
    <div class="btns" style="margin-top:6px"><button class="btn g s" id="pwS">Simpan</button><button class="btn ghost" id="pwX">${paksa ? 'Log keluar' : 'Batal'}</button></div></div>`;
  document.body.appendChild(d); $('#pwL').focus();
  const tutup = () => d.remove();
  $('#pwX').onclick = paksa ? () => $('#logout').click() : tutup; d.onclick = e => { if (e.target === d && !paksa) tutup(); };
  $('#pwS').onclick = () => { const lama = $('#pwL').value, baru = $('#pwB').value, e = $('#pwE');
    if (!lama) return e.textContent = 'Isi kata laluan semasa.';
    if (baru.length < 8) return e.textContent = 'Kata laluan baharu mesti sekurang-kurangnya 8 aksara.';
    if (baru !== $('#pwU').value) return e.textContent = 'Kata laluan baharu tidak sama.';
    if (baru === lama) return e.textContent = 'Kata laluan baharu mesti berbeza daripada kata laluan semasa.';
    $('#pwS').disabled = true;
    api('pass', {lama, baru}).then(j => { $('#pwS').disabled = false; if (j.ok) { tutup(); session.wajib = false; toast('Kata laluan ditukar'); } else e.textContent = j.err || 'Gagal. Cuba lagi.'; }); };
  d.querySelectorAll('input').forEach(i => i.onkeydown = ev => { if (ev.key === 'Enter') $('#pwS').click(); if (ev.key === 'Escape' && !paksa) tutup(); });
}
$('#gantiPass').onclick = () => tukarPass();
if (session && session.wajib) tukarPass(true);
['#who', '#av'].forEach(x => { $(x).style.cursor = 'pointer'; $(x).title = 'Tukar kata laluan'; $(x).onclick = () => tukarPass(); });
$('#logout').onclick = () => { api('logout').then(() => { location.hash = ''; location.reload(); }); };
$('#forgot').onclick = ev => { ev.preventDefault(); $('#lerr').style.color = 'var(--navy)'; $('#lerr').textContent = 'Minta Pentadbir JJT set semula kata laluan anda di Tetapan → Pengguna admin (🔑).'; };
$('#loginForm').onsubmit = ev => {
  ev.preventDefault(); const er = $('#lerr'); er.style.color = ''; er.textContent = '';
  const btn = $('#lgo'); btn.disabled = true;
  fetch('api.php?a=' + (PANEL.setup ? 'setup' : 'login'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({emel: $('#le').value.trim(), pass: $('#lp').value, nama: PANEL.setup ? $('#ln').value.trim() : ''})})
    .then(r => r.json()).then(j => { btn.disabled = false; if (!j.ok) return er.textContent = j.err || 'Gagal log masuk'; if (!location.hash || location.hash === '#') location.hash = '#/utama'; location.reload(); })
    .catch(() => { btn.disabled = false; er.textContent = 'Tiada sambungan ke pelayan.'; });
};
if (PANEL.setup) {
  $('#loginForm h1').textContent = 'Cipta akaun Pentadbir'; $('#loginForm .mut').textContent = 'Sekali sahaja: akaun pertama untuk dashboard JJT';
  $('#le').closest('.f').insertAdjacentHTML('beforebegin', '<div class="f"><label for="ln">Nama</label><input class="in" id="ln" required placeholder="Cth: Pentadbir JJT"></div>');
  $('#lp').placeholder = 'Sekurang-kurangnya 8 aksara'; $('#lp').autocomplete = 'new-password'; $('#forgot').remove(); $('#lgo').textContent = 'Cipta akaun & masuk';
}
route();
})();

/* Ikon mata: papar / sembunyi kata laluan (semua medan kata laluan, termasuk yang dicipta kemudian) */
const MATA = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const MATA_X = '<svg viewBox="0 0 24 24"><path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.1 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';
function pasangMata(root){
  (root || document).querySelectorAll('input[type=password]:not([data-mata])').forEach(i => {
    i.dataset.mata = '1';
    const w = document.createElement('span'); w.className = 'pw'; i.parentNode.insertBefore(w, i); w.appendChild(i);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pw-eye'; b.innerHTML = MATA; b.title = 'Papar kata laluan'; b.setAttribute('aria-label', 'Papar kata laluan');
    b.onclick = () => { const buka = i.type === 'password'; i.type = buka ? 'text' : 'password'; b.innerHTML = buka ? MATA_X : MATA;
      b.title = buka ? 'Sembunyi kata laluan' : 'Papar kata laluan'; b.setAttribute('aria-label', b.title); i.focus({preventScroll: true}); };
    w.appendChild(b);
  });
}
pasangMata();
new MutationObserver(() => pasangMata()).observe(document.body, {childList: true, subtree: true});
</script>
